; CursorUnbound - decouples the Skyrim menu cursor from the game frame rate.
;
; The menu cursor is normally a Scaleform sprite drawn inside the render frame, so it can
; never update more often than the game renders. CursorUnbound hides that sprite, hands the
; drawing to the Windows hardware cursor (composited at monitor refresh rate, independent
; of game fps) and feeds the OS position back into the game as an absolute coordinate
; instead of an fps-scaled delta.

[General]
; Master switch. false = the plugin loads but does nothing.
Enabled = true

; trace | debug | info | warn | error | off
; Logs to: Documents\My Games\Skyrim Special Edition\SKSE\CursorUnbound.log
LogLevel = info

[Cursor]
; true  = hide the in-game cursor and draw with the Windows hardware cursor.
;         This is the setting that actually gives OS-level smoothness.
; false = keep the game drawing its own cursor. You still get frame-rate independent
;         sensitivity from AbsolutePositioning, but the pointer stays frame-locked.
;         Use this to compare, or if the hardware cursor misbehaves in your setup.
UseHardwareCursor = true

; Hide the game's Scaleform cursor while the hardware cursor is active. Turning this off
; gives you two cursors; it only exists for diagnosing which one you are looking at.
HideGameCursor = true

; How the game's cursor sprite is suppressed. Cursor replacer mods ship differently
; structured cursormenu.swf files, so if you still see two cursors, work down this list:
;   all         - apply every method below (default)
;   setvisible  - GFxMovie::SetVisible(false) on the cursor movie
;   rootvisible - _root._visible = false
;   rootalpha   - _root._alpha = 0   (structure independent; most likely to work alone)
;   viewport    - push the cursor movie's viewport off the render surface. Uses no
;                 ActionScript at all, so it works even if the SWF is AS3 or ignores
;                 _root. Try this if none of the above hide it.
;   render      - skip the cursor movie's draw call entirely. Ignores every visibility
;                 flag, so it works even if the game re-shows the cursor each frame.
;                 This is the default because it is the only one that reliably works:
;                 the others can report success while the game re-shows the cursor
;                 every frame, leaving you with two cursors.
HideMethod = render

; Cursor image. Leave empty to auto-detect inside SKSE\Plugins\CursorUnbound
; (cursor.ani, then cursor.cur, then cursor.png, then any supported image).
; Relative paths are resolved against Data\SKSE\Plugins. Absolute paths work too.
;
; .ani and .cur carry their own hotspot and ignore HotspotX/HotspotY below.
; Anything WIC can decode (.png .bmp .tif .jpg .gif) works and uses the hotspot here.
;
; The image MUST have an alpha channel (32-bit RGBA) and be cropped to just the pointer.
; A screenshot, or any PNG saved as greyscale/RGB with no transparency, will draw as an
; opaque rectangle. Around 32x32 is normal; anything over 256px is logged as a warning.
;
; The plugin cannot read art out of a .swf, so a cursor replacer's own artwork will not
; apply automatically - drop a PNG in here instead, or install a patch that ships one.
;
; Bundled alongside cursor.png: cursor_48.png (larger), cursor_gold.png and
; cursor_gold_48.png (warm parchment arrow for UI overhauls). Point this at one of them,
; e.g. CursorFile = CursorUnbound\cursor_48.png
;
; Quotes around the path are fine and are stripped.
CursorFile =

; Hotspot in source-image pixels, before Scale is applied. For a standard arrow whose
; tip is in the top-left corner, (0, 0) is correct.
HotspotX = 0
HotspotY = 0

; Multiplier on the cursor image size. 1.0 = native size. Clamped to 0.1 - 8.0.
; The bundled art is 32px; try 1.5 on a 1440p or 4K display.
Scale = 1.0

[Behavior]
; Write the OS cursor position into the game each time it processes a mouse move, instead
; of letting it accumulate an fps-scaled delta. This is the half that fixes sensitivity.
AbsolutePositioning = true

; Zero the mouse delta for the duration of the game's own cursor handler, so it cannot
; integrate movement on top of the absolute position just written. Without this the game
; overshoots by one frame of movement every event, which looks like jitter.
;
; The delta is restored immediately after that handler returns, so other menu handlers
; (inventory item rotation, map dragging) still see the real values. If those break
; anyway, set this to false - the cursor will be less precise but nothing else changes.
NeutralizeGameDelta = true

; Confine the OS cursor to the game window while a menu is open, so the pointer cannot
; wander onto another monitor mid-menu.
ClipToWindow = true

; Stop the game from re-hiding the OS cursor while a menu is open. Without this the
; pointer can flicker on menu transitions. Disable if it conflicts with another mod that
; manages cursor visibility.
BlockGameCursorHide = true

; Also intercept ShowCursor calls made by other DLLs, not just the game executable.
;
; Windows keeps one cursor display counter for the whole process, and the game is not the
; only thing writing to it - SSEDisplayTweaks drives cursor visibility for its borderless
; window, and other SKSE plugins do their own thing. Hooking only the game's import table
; left those calls unanswered, which is how a session could end up with the pointer stuck
; visible during gameplay until you alt-tabbed out and back.
;
; Turn this off if another cursor mod stops working.
HookAllModules = true

; Keep re-hiding the OS cursor while no menu wants it, instead of hiding it once when the
; menu closes. This is the other half of the fix above: a single stray ShowCursor(true)
; from anywhere in the process used to strand the pointer on screen for the rest of the
; session, because every re-assertion the plugin had only ran while a menu was open.
;
; The check runs four times a second and only ever nudges the counter to exactly "hidden",
; and it stays out of the way entirely until the plugin has shown the cursor at least once.
; Turn it off if a mod that wants a pointer during gameplay stops being able to show one.
EnforceHiddenWhenInactive = true

; On menu open, move the OS cursor to wherever the game currently thinks the cursor is,
; so the pointer does not jump when a menu appears.
SyncOnMenuOpen = true

; Prisma UI draws its own cursor - a DirectX sprite, painted inside the render frame from
; the game's cursor position. It therefore inherits the frame-rate independent sensitivity
; from AbsolutePositioning, but it is still drawn at the game's frame rate, so next to the
; hardware cursor it looks like a second pointer trailing the first.
;
; Prisma's cursor cannot simply be moved out of the way: its own input handling reads the
; same cursor position to place clicks, so displacing the sprite would break the menu. What
; this does instead is neutralize Prisma's draw call, which that function is already written
; to tolerate - it has its own early-outs and does nothing when they are hit.
;
;   auto - suppress only while the hardware cursor is actually being drawn (default). With
;          a gamepad, or with UseHardwareCursor = false, Prisma keeps its own cursor.
;   on   - always suppress. Only useful if you want Prisma's cursor gone regardless.
;   off  - never touch Prisma. Use this if a Prisma menu loses its cursor entirely.
;
; Prisma UI is not required. Without it installed this setting does nothing at all, and the
; suppression is located by signature at startup - if a Prisma update moves it, the plugin
; logs a warning and leaves Prisma alone rather than guessing.
SuppressPrismaCursor = auto

; How the game's cursorPosX/Y should be scaled.
;   auto   - use the game's own screen dimensions if they look sane, else the window size
;   game   - always use the game's screen dimensions
;   client - always use the window client size in pixels
; Leave this on auto unless the cursor is offset from where clicks actually register.
CoordinateSpace = auto

; Manual override for the coordinate range, used when both are > 0. Only needed if auto,
; game and client all land wrong. Turn on LogCursorRange below to find the right values.
SpanX = 0
SpanY = 0

[Debug]
; Logs the range of cursor positions the game produces, every 5 seconds while a menu is
; open.
;
; To calibrate properly you must first stop this plugin from driving the position, or you
; will just be reading your own values back:
;   1. Set AbsolutePositioning = false and LogCursorRange = true
;   2. Open a menu, move the pointer into all four corners
;   3. Read the logged cursorPos min/max - that is the game's true coordinate space
;   4. Put those maxima into SpanX / SpanY above, set AbsolutePositioning = true again
LogCursorRange = false

; Periodic state summaries every few seconds. Off by default so a normal session logs a
; handful of lines. Turn on before reporting a bug.
Verbose = false
